name: Deploy ghostpaw.dev to GitHub Pages

# Publishes only the built home page and the files Pages needs.
# site/ (the lfm project) and tools/ stay in the repository but are not served.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (built output only)
        run: |
          mkdir _site
          rsync -a --exclude='/site/' --exclude='/tools/' --exclude='/.git/' --exclude='/.github/' --exclude='/.gitignore' --exclude='/_site/' ./ _site/
          test -f _site/index.html && test -f _site/CNAME
          test ! -e _site/site && test ! -e _site/tools

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
